name: CD — Build, Release & Deploy

on:
  # Manual trigger: lets you redeploy without a code change, and covers
  # pushes whose only changes are path-ignored below.
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - "README.md"
      - "openapi.yaml"
      - ".github/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Build release binary ────────────────────────────────────────────
  build:
    name: Build release binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - name: Test (gate the deploy on a green suite)
        run: cargo test
      - name: Build release
        run: cargo build --release
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: kairos-connect-doc-parser
          path: target/release/kairos-connect-doc-parser
          retention-days: 1

  # ── Create GitHub Release ───────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kairos-connect-doc-parser
      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "v${{ steps.version.outputs.version }}"
          git push -f origin "v${{ steps.version.outputs.version }}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: kairos-connect-doc-parser
          generate_release_notes: true
          make_latest: true

  # ── Deploy to Railway ───────────────────────────────────────────────
  deploy:
    name: Deploy to Railway
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_ID: 49342b8b-261c-434e-ad17-5e93ea4ccd95
      SVC_ID: 77474781-0169-4023-b6b2-16db0fae370f
      RAILWAY_ENV: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
    steps:
      # Required: `railway up` uploads the build context (Dockerfile + source).
      # Without a checkout it would upload an empty directory.
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Railway has two kinds of token and the CLI reads them from DIFFERENT
      # variables:
      #
      #   project token  (Project -> Settings -> Tokens)  -> RAILWAY_TOKEN
      #   account token  (Account -> Tokens)              -> RAILWAY_API_TOKEN
      #
      # A project token is scoped to one project+environment and lets
      # `railway up --service=<id>` run with no linking. An account token spans
      # projects but has no implicit project context, so it must link first.
      #
      # Put an account token in RAILWAY_TOKEN and the CLI reports
      # "Invalid RAILWAY_TOKEN", which reads as though the value is wrong
      # rather than in the wrong variable. This preflight says which it is.
      - name: Preflight — check Railway credentials
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          echo "RAILWAY_TOKEN (project token) present:     $([ -n "$RAILWAY_TOKEN" ] && echo yes || echo no)"
          echo "RAILWAY_API_TOKEN (account token) present: $([ -n "$RAILWAY_API_TOKEN" ] && echo yes || echo no)"

          if [ -z "$RAILWAY_TOKEN" ] && [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "::error::No Railway credential configured. Add RAILWAY_TOKEN (project token) or RAILWAY_API_TOKEN (account token)."
            exit 1
          fi

          # If a value is sitting in the wrong variable, this identifies it:
          # `whoami` only resolves for an account token. Prints an email, never
          # the token itself.
          if [ -n "$RAILWAY_TOKEN" ] && [ -z "$RAILWAY_API_TOKEN" ]; then
            if RAILWAY_TOKEN= RAILWAY_API_TOKEN="$RAILWAY_TOKEN" railway whoami >/dev/null 2>&1; then
              echo "::error::The value in RAILWAY_TOKEN is an ACCOUNT token, not a project token. Store it as the secret RAILWAY_API_TOKEN instead (or create a project token under the Kairos Connect project and keep it in RAILWAY_TOKEN)."
              exit 1
            fi
          fi

      - name: Trigger Railway deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          # An account token carries no project context, so link explicitly.
          # A project token already implies its project -- linking with one is
          # unnecessary and would fail.
          if [ -n "${RAILWAY_API_TOKEN:-}" ]; then
            echo "Using account token — linking project/service explicitly."
            railway link \
              --project "$PROJECT_ID" \
              --service "$SVC_ID" \
              --environment "$RAILWAY_ENV"
          else
            echo "Using project token — project context is implied by the token."
          fi
          railway up --service="$SVC_ID" --detach
