name: CD — Build, Release & Deploy

on:
  # Manual trigger: redeploy without a code change.
  workflow_dispatch:
  # CD is chained to CI rather than firing on push directly, so a deploy can
  # only come from a commit whose checks actually went green. Previously both
  # workflows started on the same push and raced, meaning a red CI did not stop
  # a deploy. `workflow_run` fires when CI finishes; the gate drops anything
  # that did not succeed.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

# One deploy at a time. The release job force-pushes a tag and replaces the
# release asset, so two overlapping runs would fight over the same objects.
# cancel-in-progress stays false deliberately: cancelling a run that has already
# reached `railway up` would leave a half-finished production deploy.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RAILWAY_CLI_VERSION: "5.37.7"

jobs:
  # ── Gate: CI must have passed, and something deployable must have changed ──
  gate:
    name: Verify CI succeeded
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
      sha: ${{ steps.scope.outputs.sha }}
    steps:
      # On a workflow_run event `github.sha` is the default branch head, NOT
      # the commit that triggered CI. Always resolve the triggering commit.
      - name: Resolve triggering commit
        id: sha
        run: echo "value=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.value }}
          fetch-depth: 2

      # `workflow_run` does not support paths-ignore, so the previous
      # push-trigger's filter is reproduced here: a docs-only commit should not
      # ship a new production build.
      - name: Check for deployable changes
        id: scope
        run: |
          set -euo pipefail
          SHA="${{ steps.sha.outputs.value }}"
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — deploying regardless of changed paths."
            echo "deploy=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1...HEAD 2>/dev/null || true)
          echo "Changed files:"; echo "${CHANGED:-(none)}"

          DEPLOYABLE=$(printf '%s\n' "$CHANGED" | grep -vE '^(README\.md|openapi\.yaml|\.github/)' || true)
          if [ -n "$DEPLOYABLE" ]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::Only docs/workflow files changed — skipping deploy."
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi

  # ── Build release binary ────────────────────────────────────────────
  build:
    name: Build release binary
    needs: [gate]
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        # Stamp the commit into the binary so /health can prove which build is
        # actually serving traffic.
        run: BUILD_SHA="${{ needs.gate.outputs.sha }}" cargo build --release
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: kairos-connect-doc-parser
          path: target/release/kairos-connect-doc-parser
          retention-days: 1

  # ── Create GitHub Release ───────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: kairos-connect-doc-parser
      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "v${{ steps.version.outputs.version }}"
          git push -f origin "v${{ steps.version.outputs.version }}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: kairos-connect-doc-parser
          generate_release_notes: true
          make_latest: true

  # ── Deploy to Railway ───────────────────────────────────────────────
  deploy:
    name: Deploy to Railway
    needs: [gate, release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_ID: 49342b8b-261c-434e-ad17-5e93ea4ccd95
      SVC_ID: 77474781-0169-4023-b6b2-16db0fae370f
      RAILWAY_ENV: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
    steps:
      # Required: `railway up` uploads the build context (Dockerfile + source).
      # Without a checkout it would upload an empty directory.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      # Installing the CLI is the least reliable step in this pipeline, and
      # both failures so far came from the same place: GitHub's release CDN.
      #   run 31619921330 -- npm postinstall, "socket hang up"
      #   run 31620361142 -- direct curl, six retries all HTTP 503
      #
      # `npm install -g @railway/cli` is NOT an independent fallback: its
      # postinstall downloads from that same CDN, so it fails identically.
      # The real mitigations are (a) cache the binary so most runs never
      # download at all, and (b) when we must fetch, try both the authenticated
      # API and the CDN, with backoff long enough to outlast a 503 wave.
      - name: Cache Railway CLI
        id: railway-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/railway
          key: railway-cli-${{ env.RAILWAY_CLI_VERSION }}-x86_64-linux-musl

      - name: Install Railway CLI
        if: steps.railway-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${RAILWAY_CLI_VERSION}"
          TARBALL="railway-v${V}-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p "$HOME/.local/bin"

          via_api() {
            gh release download "v${V}" -R railwayapp/cli \
              -p "$TARBALL" -O /tmp/railway.tar.gz --clobber
          }
          via_cdn() {
            curl -fsSL \
              --retry 8 --retry-delay 10 --retry-all-errors \
              --connect-timeout 15 --max-time 300 \
              -o /tmp/railway.tar.gz \
              "https://github.com/railwayapp/cli/releases/download/v${V}/${TARBALL}"
          }

          if via_api; then
            echo "Fetched via authenticated GitHub API."
          elif via_cdn; then
            echo "Fetched via release CDN."
          else
            echo "::error::Could not download Railway CLI v${V} by any route. Both the GitHub API and the release CDN failed; this is upstream, not a repo problem. Re-run the job."
            exit 1
          fi

          tar -xzf /tmp/railway.tar.gz -C "$HOME/.local/bin" railway
          chmod +x "$HOME/.local/bin/railway"

      - name: Put Railway CLI on PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Confirm Railway CLI
        run: railway --version

      # Railway has two kinds of token and the CLI reads them from DIFFERENT
      # variables:
      #
      #   project token  (Project -> Settings -> Tokens)  -> RAILWAY_TOKEN
      #   account token  (Account -> Tokens)              -> RAILWAY_API_TOKEN
      #
      # A project token is scoped to one project+environment and lets
      # `railway up --service=<id>` run with no linking. An account token spans
      # projects but has no implicit project context, so it must link first.
      #
      # Put an account token in RAILWAY_TOKEN and the CLI reports
      # "Invalid RAILWAY_TOKEN", which reads as though the value is wrong
      # rather than in the wrong variable. This preflight says which it is.
      - name: Preflight — check Railway credentials
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          echo "RAILWAY_TOKEN (project token) present:     $([ -n "$RAILWAY_TOKEN" ] && echo yes || echo no)"
          echo "RAILWAY_API_TOKEN (account token) present: $([ -n "$RAILWAY_API_TOKEN" ] && echo yes || echo no)"

          if [ -z "$RAILWAY_TOKEN" ] && [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "::error::No Railway credential configured. Add RAILWAY_TOKEN (project token) or RAILWAY_API_TOKEN (account token)."
            exit 1
          fi

          # If a value is sitting in the wrong variable, this identifies it:
          # `whoami` only resolves for an account token. Prints an email, never
          # the token itself.
          if [ -n "$RAILWAY_TOKEN" ] && [ -z "$RAILWAY_API_TOKEN" ]; then
            if RAILWAY_TOKEN= RAILWAY_API_TOKEN="$RAILWAY_TOKEN" railway whoami >/dev/null 2>&1; then
              echo "::error::The value in RAILWAY_TOKEN is an ACCOUNT token, not a project token. Store it as the secret RAILWAY_API_TOKEN instead (or create a project token under the Kairos Connect project and keep it in RAILWAY_TOKEN)."
              exit 1
            fi
          fi

      - name: Trigger Railway deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          # An account token carries no project context, so link explicitly.
          # A project token already implies its project — linking with one is
          # unnecessary and would fail.
          if [ -n "${RAILWAY_API_TOKEN:-}" ]; then
            echo "Using account token — linking project/service explicitly."
            railway link \
              --project "$PROJECT_ID" \
              --service "$SVC_ID" \
              --environment "$RAILWAY_ENV"
          else
            echo "Using project token — project context is implied by the token."
          fi
          railway up --service="$SVC_ID" --detach

      # `railway up --detach` returns as soon as the upload is accepted, so a
      # green deploy job proves nothing about what is running. Worse, the image
      # pulls the release binary with a plain `RUN curl .../latest/...`, whose
      # Docker cache key never changes — a deploy can therefore rebuild happily
      # and still ship the PREVIOUS binary. That happened: the OCR speedup was
      # released and deployed, and production kept serving the old build with
      # every check green.
      #
      # Poll /health until the build it reports matches the commit we deployed.
      - name: Verify the deployed build is the one we just shipped
        env:
          EXPECTED_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -uo pipefail
          URL="https://parse-doc.thekairos.app/health"
          # A Railway build can sit queued for a builder for several minutes
          # before it even starts, so allow generously more than a build takes.
          ATTEMPTS=60
          INTERVAL=15

          for attempt in $(seq 1 $ATTEMPTS); do
            BODY=$(curl -fsSL --max-time 10 "$URL" 2>/dev/null) || BODY=""

            if [ -z "$BODY" ]; then
              STATE="service unreachable"
            else
              BUILD=$(printf '%s' "$BODY" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin).get("build",""))' 2>/dev/null || echo "")
              if [ "$BUILD" = "$EXPECTED_SHA" ]; then
                echo "::notice::Live build matches ${EXPECTED_SHA} after ${attempt} attempt(s)."
                exit 0
              elif [ -z "$BUILD" ]; then
                # Reachable, but the response has no `build` key at all: this is
                # a binary from before /health reported it. Distinct from
                # unreachable, and from running the wrong commit.
                STATE="reachable, but serving a pre-stamp binary (no build field)"
              else
                STATE="serving build ${BUILD}"
              fi
            fi

            echo "attempt ${attempt}/${ATTEMPTS}: ${STATE}; want ${EXPECTED_SHA}"
            sleep $INTERVAL
          done

          echo "::error::After $((ATTEMPTS * INTERVAL / 60)) minutes production is still ${STATE}, not ${EXPECTED_SHA}. Check the Railway deployment: a build stuck at \"scheduling build on Metal builder\" never replaces the running container, so this step will wait out its whole budget while the old binary keeps serving."
          exit 1
