[package]
name = "kairos-connect-doc-parser"
version = "0.2.0"
edition = "2024"
description = "HTTP microservice for document-to-markdown conversion with OCR support for images and scanned PDFs"

[dependencies]
anydoc = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
bytes = "1"
image = "0.25"
tempfile = "3"
